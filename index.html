<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intervention d'Urgence</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 400px; margin: auto; background-color: #f4f4f9; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #333; font-size: 20px; text-align: center; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #555; }
        input[type="text"], input[type="tel"], textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .consigne-photo { font-size: 13px; color: #856404; background-color: #fff3cd; border-left: 4px solid #ffeeba; padding: 10px; margin-top: 5px; border-radius: 4px; }
        input[type="file"] { margin-top: 10px; width: 100%; }
        button { margin-top: 20px; padding: 12px; width: 100%; background: #d9534f; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Demande de Dépannage</h2>
        <form id="urgenceForm">
            <label>Nom du contact :</label>
            <input type="text" id="nom" required>

            <label>Numéro de téléphone :</label>
            <input type="tel" id="telephone" required>

            <label>Nature de l'urgence :</label>
            <textarea id="probleme" rows="3" placeholder="Ex: Fuite d'eau, vanne fermée..." required></textarea>

            <label>Photo du problème :</label>
            <div class="consigne-photo">
                <strong>Important :</strong> Photographiez l'installation complète avec un mètre de recul (tuyaux, raccords). Ne photographiez pas uniquement la flaque d'eau.
            </div>
            <input type="file" id="photo" accept="image/*" capture="environment">

            <button type="submit">Envoyer l'Alerte</button>
        </form>
    </div>

    <script>
        document.getElementById('urgenceForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.querySelector('button');
            btn.innerText = 'Traitement en cours...';
            btn.disabled = true;

            const photoInput = document.getElementById('photo');
            let photoData = null;

            if (photoInput.files && photoInput.files[0]) {
                const file = photoInput.files[0];
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800;
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleSize;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        photoData = canvas.toDataURL('image/jpeg', 0.6);
                        envoyerDonnees(photoData);
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            } else {
                envoyerDonnees(null);
            }

            function envoyerDonnees(photoBase64) {
                const data = {
                    nom: document.getElementById('nom').value,
                    telephone: document.getElementById('telephone').value,
                    probleme: document.getElementById('probleme').value,
                    photo: photoBase64
                };

                fetch('https://portfoliohighgency.app.n8n.cloud/webhook-test/4a1614a7-25d5-461b-afbf-4e504720d70d', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                }).then(response => {
                    document.body.innerHTML = '<div class="container"><h3>Alerte transmise. Un technicien analyse la photo et vous rappelle.</h3></div>';
                }).catch(error => {
                    btn.innerText = 'Échec réseau. Réessayez.';
                    btn.disabled = false;
                });
            }
        });
    </script>
</body>
</html>
