<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intervention d'Urgence</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 400px; margin: auto; background-color: #f4f4f9; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #333; font-size: 20px; text-align: center; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #555; }
        input[type="text"], input[type="tel"], textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .consigne-photo { font-size: 13px; color: #856404; background-color: #fff3cd; border-left: 4px solid #ffeeba; padding: 10px; margin-top: 5px; border-radius: 4px; }
        input[type="file"] { margin-top: 10px; width: 100%; }
        button { margin-top: 20px; padding: 12px; width: 100%; background: #d9534f; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .masque { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Demande de Dépannage</h2>
        <form id="urgenceForm">
            <!-- Champ invisible pour bloquer les robots -->
            <input type="text" id="robot_check" class="masque" autocomplete="off" tabindex="-1">

            <label>Nom du contact :</label>
            <input type="text" id="nom" required>

            <label>Numéro de téléphone :</label>
            <input type="tel" id="telephone" pattern="^(?:(?:\+|00)33|0)\s*[1-9](?:[\s.-]*\d{2}){4}$" title="Format valide requis (ex: 0612345678)" required>

            <label>Nature de l'urgence :</label>
            <textarea id="probleme" rows="3" placeholder="Ex: Fuite d'eau, vanne fermée..." required></textarea>

            <label>Photo du problème :</label>
            <div class="consigne-photo">
                <strong>Important :</strong> Photographiez l'installation complète avec un mètre de recul (tuyaux, raccords). Ne photographiez pas uniquement la flaque d'eau.
            </div>
            <input type="file" id="photo" accept="image/*" capture="environment">

            <button type="submit">Envoyer l'Alerte</button>
        </form>
    </div>

<script>
document.querySelector('form').addEventListener('submit', async function(event) {
    event.preventDefault();

    if (document.getElementById('robot_check').value !== "") return;

    const submitBtn = document.querySelector('button[type="submit"]');
    const originalText = submitBtn.textContent;
    submitBtn.textContent = "Traitement et envoi...";
    submitBtn.disabled = true;

    try {
        const nom = document.getElementById('nom').value;
        const telephone = document.getElementById('telephone').value;
        const probleme = document.getElementById('probleme').value;
        
        const photoInput = document.querySelector('input[type="file"]');
        let photoData = null;

        if (photoInput.files && photoInput.files.length > 0) {
            photoData = await new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 1024;
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height = Math.round((height * MAX_WIDTH) / width);
                        width = MAX_WIDTH;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', 0.7));
                };
                img.onerror = reject;
                img.src = URL.createObjectURL(photoInput.files[0]);
            });
        }

       const payload = { nom, telephone, probleme, photo: photoData };

const response = await fetch('/api/submit', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
});

        if (response.ok) {
            alert("Demande envoyée avec succès.");
            event.target.reset();
        } else {
            alert("Erreur de communication avec le serveur.");
        }
    } catch (error) {
        alert("Erreur système : " + error.message);
    } finally {
        submitBtn.textContent = originalText;
        submitBtn.disabled = false;
    }
});
</script>
</body>
</html>
</body>
</html>
