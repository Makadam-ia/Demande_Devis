<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demande de Dépannage</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f4f6f8;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        h2 {
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 24px;
            color: #1a1a1a;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #4b5563;
        }

        input[type="text"],
        input[type="tel"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus,
        input[type="tel"]:focus,
        input[type="email"]:focus,
        select:focus,
        textarea:focus {
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            margin-bottom: 20px;
            background-color: #f9fafb;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
        }

        .checkbox-group input[type="checkbox"] {
            margin-right: 12px;
            margin-top: 3px;
            transform: scale(1.2);
            cursor: pointer;
        }

        .checkbox-group label {
            font-weight: 500;
            margin-bottom: 0;
            line-height: 1.4;
            cursor: pointer;
            font-size: 13.5px;
        }

        .alert-box {
            background-color: #fffbeb;
            border-left: 4px solid #f59e0b;
            padding: 12px 16px;
            border-radius: 4px;
            font-size: 13px;
            line-height: 1.5;
            color: #92400e;
            margin-bottom: 16px;
        }

        .file-upload-container {
            border: 2px dashed #d1d5db;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s;
            background-color: #f9fafb;
            margin-bottom: 24px;
        }

        .file-upload-container:hover {
            border-color: #ef4444;
        }

        .file-upload-container input[type="file"] {
            display: none;
        }

        .file-upload-label {
            font-size: 14px;
            color: #4b5563;
            cursor: pointer;
            font-weight: 500;
        }

        .btn-primary {
            background-color: #ef4444;
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            min-height: 48px;
        }

        .btn-primary:hover {
            background-color: #dc2626;
        }

        .btn-retour {
            background-color: #f1f3f5;
            color: #495057;
            border: 1px solid #ced4da;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            font-size: 16px;
            font-weight: 600;
            transition: background-color 0.2s;
            min-height: 48px;
        }

        .btn-retour:hover {
            background-color: #e2e6ea;
        }

        #success-container {
            text-align: center;
        }

        #success-container p {
            font-size: 16px;
            font-weight: 500;
            color: #1f2937;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="card" id="form-container">
        <h2>Demande de Dépannage</h2>
        <form id="form-urgence">
            <div class="form-group">
                <label for="nom">Nom du contact :</label>
                <input type="text" id="nom" required>
            </div>

            <div class="form-group">
                <label for="telephone">Numéro de téléphone :</label>
                <input type="tel" id="telephone" required>
            </div>

            <div class="form-group">
                <label for="email">Adresse e-mail :</label>
                <input type="email" id="email" required>
            </div>

            <div class="form-group">
                <label for="adresse">Adresse de l'intervention :</label>
                <input type="text" id="adresse" placeholder="N°, Rue..." required>
            </div>

            <div class="form-group">
                <label for="code_postal">Code Postal et Ville :</label>
                <input type="text" id="code_postal" placeholder="Ex: 34540 Balaruc-les-Bains" required>
            </div>

            <div class="form-group">
                <label for="categorie">Catégorie de l'urgence :</label>
                <select id="categorie" name="categorie" required>
                    <option value="" disabled selected>Sélectionnez une option...</option>
                    <option value="Fuite apparente ou sous un équipement">Fuite apparente ou sous un équipement</option>
                    <option value="Écoulement bloqué (bouchon)">Écoulement bloqué (bouchon)</option>
                    <option value="Panne d'eau chaude">Panne d'eau chaude</option>
                    <option value="Dégât des eaux / Rupture franche">Dégât des eaux / Rupture franche</option>
                    <option value="Autre anomalie">Autre anomalie</option>
                </select>
            </div>

            <div class="form-group">
                <label for="probleme">Description détaillée :</label>
                <textarea id="probleme" name="probleme" placeholder="Apportez des précisions utiles au diagnostic..." required></textarea>
            </div>

            <div class="form-group">
                <label>Photo du problème :</label>
                <div class="alert-box">
                    <strong>Important :</strong> Photographiez l'installation complète avec un mètre de recul (tuyaux, raccords). Ne photographiez pas uniquement la flaque d'eau.
                </div>
                <div class="file-upload-container" onclick="document.getElementById('photo').click();">
                    <span class="file-upload-label" id="file-label">Cliquez ici pour ajouter une photo</span>
                    <input type="file" id="photo" accept="image/*" required onchange="document.getElementById('file-label').textContent = this.files[0] ? this.files[0].name : 'Cliquez ici pour ajouter une photo';">
                </div>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="eau_coupee" name="eau_coupee">
                <label for="eau_coupee">L'arrivée d'eau générale est coupée (compteur fermé).</label>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="consentement" name="consentement" required>
                <label for="consentement">Je confirme nécessiter une intervention d'urgence et accepte la facturation des frais de déplacement inhérents.</label>
            </div>

            <button type="submit" class="btn-primary" id="submit-btn" data-track="bouton-envoyer-alerte">Envoyer l'Alerte</button>
        </form>
    </div>

    <div class="card" id="success-container" style="display: none;">
        <p>Alerte transmise. Un technicien analyse la photo et vous rappelle immédiatement.</p>
        <button type="button" id="btn-retour" class="btn-retour" data-track="bouton-nouvelle-urgence">Nouvelle urgence</button>
    </div>

    <script>
        document.getElementById('form-urgence').addEventListener('submit', async function(event) {
            event.preventDefault();

            const submitBtn = document.getElementById('submit-btn');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = "Envoi en cours...";
            submitBtn.disabled = true;

            try {
                const nom = document.getElementById('nom').value;
                const telephone = document.getElementById('telephone').value;
                const email = document.getElementById('email').value;
                const adresse = document.getElementById('adresse').value;
                const code_postal = document.getElementById('code_postal').value;
                const categorie = document.getElementById('categorie').value;
                const description = document.getElementById('probleme').value;
                const eau_coupee = document.getElementById('eau_coupee').checked;
                const consentement = document.getElementById('consentement').checked;
                const problemeComplet = categorie + " - " + description;
                const fileInput = document.getElementById('photo').files[0];

                let photoData = "";
                if (fileInput) {
                    photoData = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            const img = new Image();
                            img.onload = () => {
                                const canvas = document.createElement('canvas');
                                const MAX_WIDTH = 800;
                                const MAX_HEIGHT = 800;
                                let width = img.width;
                                let height = img.height;

                                if (width > height) {
                                    if (width > MAX_WIDTH) {
                                        height *= MAX_WIDTH / width;
                                        width = MAX_WIDTH;
                                    }
                                } else {
                                    if (height > MAX_HEIGHT) {
                                        width *= MAX_HEIGHT / height;
                                        height = MAX_HEIGHT;
                                    }
                                }

                                canvas.width = width;
                                canvas.height = height;
                                const ctx = canvas.getContext('2d');
                                ctx.drawImage(img, 0, 0, width, height);
                                resolve(canvas.toDataURL('image/jpeg', 0.6));
                            };
                            img.src = e.target.result;
                        };
                        reader.readAsDataURL(fileInput);
                    });
                }

                const payload = { 
                    nom, 
                    telephone, 
                    email, 
                    adresse,
                    code_postal,
                    eau_coupee,
                    consentement_tarifaire: consentement,
                    probleme: problemeComplet, 
                    photo: photoData 
                };

                const response = await fetch('https://portfoliohighgency.app.n8n.cloud/webhook/4a1614a7-25d5-461b-afbf-4e504720d70d', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    document.getElementById('form-container').style.display = 'none';
                    document.getElementById('success-container').style.display = 'block';
                } else {
                    alert("Erreur de communication avec le serveur.");
                }
            } catch (error) {
                alert("Erreur réseau ou système.");
            } finally {
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }
        });

        document.getElementById('btn-retour').addEventListener('click', function() {
            document.getElementById('form-urgence').reset();
            document.getElementById('file-label').textContent = 'Cliquez ici pour ajouter une photo';
            document.getElementById('success-container').style.display = 'none';
            document.getElementById('form-container').style.display = 'block';
        });

        const SUPABASE_URL = 'https://zchxerepjpxmjfcieyai.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpjaHhlcmVwanB4bWpmY2lleWFpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NTM2MzcsImV4cCI6MjEwMzMyOTYzN30.HSqHwBsFsM8s0zod-sdXhiKJCYTTYR7PRPjMytGQfFM';

        document.addEventListener('click', async function(e) {
            const target = e.target.closest('[data-track]');
            if (!target) return;

            let visiteurId = localStorage.getItem('visiteur_id');
            if (!visiteurId) {
                visiteurId = Math.random().toString(36).substring(2) + Date.now().toString(36);
                localStorage.setItem('visiteur_id', visiteurId);
            }

            const cible = target.getAttribute('data-track');
            const page = window.location.pathname;

            try {
                await fetch(`${SUPABASE_URL}/rest/v1/analytics_events`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({
                        action: 'clic',
                        cible: cible,
                        page: page,
                        visiteur: visiteurId
                    })
                });
            } catch (err) {
                console.error("Erreur tracking", err);
            }
        });
    </script>
</body>
</html>
