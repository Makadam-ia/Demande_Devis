<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demande de Dépannage</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f4f6f8;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        h2 {
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 24px;
            color: #1a1a1a;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #4b5563;
        }

        input[type="text"],
        input[type="tel"],
        textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus,
        input[type="tel"]:focus,
        textarea:focus {
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .alert-box {
            background-color: #fffbeb;
            border-left: 4px solid #f59e0b;
            padding: 12px 16px;
            border-radius: 4px;
            font-size: 13px;
            line-height: 1.5;
            color: #92400e;
            margin-bottom: 16px;
        }

        .file-upload-container {
            border: 2px dashed #d1d5db;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s;
            background-color: #f9fafb;
            margin-bottom: 24px;
        }

        .file-upload-container:hover {
            border-color: #ef4444;
        }

        .file-upload-container input[type="file"] {
            display: none;
        }

        .file-upload-label {
            font-size: 14px;
            color: #4b5563;
            cursor: pointer;
            font-weight: 500;
        }

        .btn-primary {
            background-color: #ef4444;
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            min-height: 48px;
        }

        .btn-primary:hover {
            background-color: #dc2626;
        }

        .btn-retour {
            background-color: #f1f3f5;
            color: #495057;
            border: 1px solid #ced4da;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            font-size: 16px;
            font-weight: 600;
            transition: background-color 0.2s;
            min-height: 48px;
        }

        .btn-retour:hover {
            background-color: #e2e6ea;
        }

        #success-container {
            text-align: center;
        }

        #success-container p {
            font-size: 16px;
            font-weight: 500;
            color: #1f2937;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="card" id="form-container">
        <h2>Demande de Dépannage</h2>
        <form id="form-urgence">
            <div class="form-group">
                <label for="nom">Nom du contact :</label>
                <input type="text" id="nom" required>
            </div>

            <div class="form-group">
                <label for="telephone">Numéro de téléphone :</label>
                <input type="tel" id="telephone" required>
            </div>

            <div class="form-group">
                <label for="probleme">Nature de l'urgence :</label>
                <textarea id="probleme" placeholder="Ex: Fuite d'eau, vanne fermée..." required></textarea>
            </div>

            <div class="form-group">
                <label>Photo du problème :</label>
                <div class="alert-box">
                    <strong>Important :</strong> Photographiez l'installation complète avec un mètre de recul (tuyaux, raccords). Ne photographiez pas uniquement la flaque d'eau.
                </div>
                <div class="file-upload-container" onclick="document.getElementById('photo').click();">
                    <span class="file-upload-label" id="file-label">Cliquez ici pour ajouter une photo</span>
                    <input type="file" id="photo" accept="image/*" required onchange="document.getElementById('file-label').textContent = this.files[0] ? this.files[0].name : 'Cliquez ici pour ajouter une photo';">
                </div>
            </div>

            <button type="submit" class="btn-primary" id="submit-btn">Envoyer l'Alerte</button>
        </form>
    </div>

    <div class="card" id="success-container" style="display: none;">
        <p>Alerte transmise. Un technicien analyse la photo et vous rappelle.</p>
        <button type="button" id="btn-retour" class="btn-retour">Nouvelle urgence</button>
    </div>

    <script>
        document.getElementById('form-urgence').addEventListener('submit', async function(event) {
            event.preventDefault();

            const submitBtn = document.getElementById('submit-btn');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = "Envoi en cours...";
            submitBtn.disabled = true;

            try {
                const nom = document.getElementById('nom').value;
                const telephone = document.getElementById('telephone').value;
                const probleme = document.getElementById('probleme').value;
                const fileInput = document.getElementById('photo').files[0];

                let photoData = "";
                if (fileInput) {
                    const reader = new FileReader();
                    photoData = await new Promise((resolve) => {
                        reader.onload = (e) => resolve(e.target.result);
                        reader.readAsDataURL(fileInput);
                    });
                }

                const payload = { nom, telephone, probleme, photo: photoData };

                const response = await fetch('/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    document.getElementById('form-container').style.display = 'none';
                    document.getElementById('success-container').style.display = 'block';
                } else {
                    alert("Erreur de communication avec le serveur.");
                }
            } catch (error) {
                alert("Erreur système : " + error.message);
            } finally {
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }
        });

        document.getElementById('btn-retour').addEventListener('click', function() {
            document.querySelector('form').reset();
            document.getElementById('file-label').textContent = 'Cliquez ici pour ajouter une photo';
            document.getElementById('success-container').style.display = 'none';
            document.getElementById('form-container').style.display = 'block';
        });
    </script>
</body>
</html>
